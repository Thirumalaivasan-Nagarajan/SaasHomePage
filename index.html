<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .container
    {
      display:flex;
      flex-wrap:wrap;
    }
    .one 
    {
      background-color: rgb(168, 168, 51);
      padding:10px;
      flex-basis:22%;
      margin:10px;
    }
    @media screen and (max-width:600px)
    {
      .one
      {
        flex-basis:40%;
      }
    }
    @media screen and (max-width:380px)
    {
      .one
      {
        flex-basis:100%;
      }
    }
  </style>
  <title>Responsive Web Desighn</title>
</head>
<body>
    <div class="container">
      <div class="one">
<h1>Four</h1>
      </div>
      <div class="one">
        <h1>One</h1>
      </div>
      <div class="one">
        <h1>Two</h1>
      </div>
      <div class="one">
<h1>Three</h1>
      </div>
    </div>
</body>
</html>
